# Dependabot pitää SHA:han lukitut GitHub Actionit ajan tasalla:
# se avaa pull requestin, kun actioniin tulee uusi versio, ja päivittää sekä SHA:n että versiokommentin.
# Pull requestissa ajetaan tarkistukset, mutta ei julkaisua, joten päivityksen voi katsoa ennen yhdistämistä.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
