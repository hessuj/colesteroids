# Colesteroids OG+ – automaattinen tarkistus- ja julkaisuputki
#
#   1. Tarkistukset (jokaisessa pushissa ja pull requestissa):
#        - salaisuusskannaus koko git-historiasta (gitleaks)
#        - HTML-rakenne, JavaScript-syntaksi, kielitiedostot, kentät ja PHP-syntaksi (tools/check_site.py)
#   2. Julkaisu FTP:llä osoitteeseen hessujarvinen.com/softa/colesteroids
#        - vain main-haarasta ja vain, jos kaikki tarkistukset menivät läpi
#
# Kaikki actionit on lukittu commit-SHA:han, koska julkaisuvaiheen action näkee FTP-tunnukset.
# Tagin (esim. @v4) voi siirtää osoittamaan muuhun koodiin, SHA:ta ei. Dependabot ehdottaa
# päivityksiä viikoittain (.github/dependabot.yml).

name: Tarkista ja julkaise peli

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Vähimmät oikeudet: putki vain lukee repoa
permissions:
  contents: read

# Kaksi julkaisua ei koskaan aja yhtä aikaa samaan kansioon
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tarkistukset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Hae koodi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # gitleaks skannaa koko historian
          persist-credentials: false  # GitHub-tunnus ei jää levylle

      # Gitleaks ajetaan julkaisun omana binäärinä, jonka tarkistussumma varmistetaan.
      # Näin skannaukselle ei tarvitse antaa GitHub-tunnusta eikä kolmannen osapuolen actionia.
      - name: Salaisuusskannaus (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - name: HTML-, JavaScript-, kieli-, kenttä- ja PHP-tarkistukset
        run: python3 tools/check_site.py

  deploy:
    name: Julkaisu
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://hessujarvinen.com/softa/colesteroids
    steps:
      - name: Hae koodi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Kopioi peli hessujarvinen.com/softa/colesteroids
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./web/
          server-dir: ./
          # palvelimen tulostaulu ja jakokuvat (data/) eivät ole repossa, eikä julkaisu koske niihin
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/**
